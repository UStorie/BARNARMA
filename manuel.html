<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Manuel d'utilisation — BARNMAP FOR ENFUSION</title>
  <meta name="theme-color" content="#03131b">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02070a;
      font-family: Arial, Helvetica, sans-serif;
    }
    .manual-bar {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: rgba(3, 16, 24, 0.97);
      border-bottom: 1px solid rgba(38, 186, 236, 0.38);
      box-shadow: 0 7px 22px rgba(0,0,0,0.35);
    }
    .back-button {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(51, 190, 239, 0.65);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(180deg, #0b5878 0%, #062b3e 100%);
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
    }
    .manual-title {
      color: rgba(255,255,255,0.90);
      font-size: 14px;
      font-weight: 700;
    }
    .pdf-frame {
      position: fixed;
      top: 56px;
      left: 0;
      width: 100%;
      height: calc(100% - 56px);
      border: 0;
      background: #111;
    }
    .fallback {
      position: fixed;
      inset: 56px 0 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      text-align: center;
    }
    .fallback a { color: #39c4f6; }
    @media (max-width: 560px) {
      .manual-title { display: none; }
      .back-button { font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="manual-bar">
    <a class="back-button" href="index.html">← Retour au site</a>
    <div class="manual-title">BARNMAP FOR ENFUSION — Manuel d'utilisation</div>
  </header>

  <div class="fallback">
    <p>Si le PDF ne s'affiche pas, <a href="assets/BARNMAP_Manuel_Import_Enfusion.pdf">ouvrez le manuel directement</a>.</p>
  </div>

  <iframe
    class="pdf-frame"
    src="assets/BARNMAP_Manuel_Import_Enfusion.pdf#view=FitH"
    title="Manuel d'utilisation BARNMAP FOR ENFUSION"
  ></iframe>
</body>
</html>
